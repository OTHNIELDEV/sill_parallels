<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Sill 앱 아이콘 — 밤하늘 바탕 · 새벽빛 두 칸 창 · 나무 창턱. 원본은 이 파일, PNG · ICNS 는 make-icon 으로 만든다 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3A8C"/>
      <stop offset="1" stop-color="#0E1530"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.55">
      <stop offset="0" stop-color="#93B4FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#93B4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC4FA"/>
      <stop offset="0.62" stop-color="#C7D8F5"/>
      <stop offset="1" stop-color="#FDBA8C"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C873"/>
      <stop offset="0.5" stop-color="#E29A3E"/>
      <stop offset="1" stop-color="#B86E22"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="1" stop-color="#FFB36B"/>
    </linearGradient>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="panes">
      <rect x="318" y="262" width="183" height="402" rx="18"/>
      <rect x="523" y="262" width="183" height="402" rx="18"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- 별 -->
    <g fill="#FFFFFF">
      <circle cx="210" cy="230" r="5" opacity="0.8"/>
      <circle cx="820" cy="200" r="4" opacity="0.7"/>
      <circle cx="850" cy="420" r="3" opacity="0.6"/>
      <circle cx="175" cy="470" r="3" opacity="0.55"/>
      <circle cx="760" cy="300" r="2.5" opacity="0.6"/>
    </g>
  </g>

  <!-- 창 -->
  <g filter="url(#shadow)">
    <rect x="278" y="222" width="468" height="482" rx="40" fill="url(#frame)"/>
  </g>
  <g clip-path="url(#panes)">
    <rect x="300" y="250" width="430" height="430" fill="url(#sky)"/>
    <circle cx="512" cy="600" r="104" fill="url(#sun)"/>
    <path d="M300 612 Q420 570 512 604 T730 596 L730 690 L300 690 Z" fill="#5E78CC"/>
    <path d="M300 640 Q430 610 540 640 T730 632 L730 690 L300 690 Z" fill="#45599F"/>
    <path d="M330 262 L420 262 L330 420 Z" fill="#FFFFFF" opacity="0.18"/>
    <path d="M535 262 L625 262 L535 420 Z" fill="#FFFFFF" opacity="0.18"/>
  </g>

  <!-- 창턱 -->
  <g filter="url(#shadow)">
    <rect x="226" y="690" width="572" height="74" rx="22" fill="url(#wood)"/>
  </g>
  <rect x="242" y="696" width="540" height="12" rx="6" fill="#FFFFFF" opacity="0.35"/>
</svg>
